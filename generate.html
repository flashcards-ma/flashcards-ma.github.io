<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de lien ambassadeur — Flashcards.ma</title>
<style>
  :root { --navy:#0e2a44; --teal:#0e7c7b; --gold:#c19a4b; --cream:#f6f7f9; --ink:#0f2237; --muted:#6b7f92; --line:#e3e8ee; --card:#ffffff; --field:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --cream:#0b1420; --ink:#eef3f8; --muted:#8aa0b5; --line:#24344c; --card:#121f31; --field:#18293f; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--cream); color:var(--ink); padding:20px; max-width:720px; margin:0 auto; }
  h1 { font-family:Newsreader,Georgia,serif; font-size:1.5rem; margin:8px 0 4px; }
  h1 svg { width:22px; height:22px; vertical-align:-4px; color:var(--teal); }
  p.sub { color:var(--muted); margin-bottom:16px; font-size:.95rem; }
  .card { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 4px 14px rgba(14,42,68,.06); margin-bottom:14px; }
  label { display:block; font-size:.85rem; margin-bottom:6px; color:var(--muted); }
  input { width:100%; padding:12px; font-size:1rem; border:1.5px solid var(--line); border-radius:10px; margin-bottom:12px; background:var(--field); color:var(--ink); }
  button { width:100%; padding:13px; font-size:1rem; font-weight:700; color:#fff; background:var(--teal); border:none; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button.secondary { background:var(--card); color:var(--teal); border:1.5px solid var(--teal); margin-top:10px; }
  .err { color:#ff9a8a; font-size:.9rem; margin-top:8px; white-space:pre-wrap; }
  .ok { color:var(--teal); font-size:.9rem; margin-top:8px; }
  .note { font-size:.82rem; color:var(--muted); margin-top:10px; }
  .hidden { display:none; }
  .linkbox { background:var(--cream); border:1.5px dashed var(--teal); border-radius:10px; padding:14px; margin:12px 0; word-break:break-all; font-size:1rem; }
  .steps { font-size:.9rem; color:var(--muted); margin-top:8px; line-height:1.7; }
  .steps .done { color:var(--teal); }
  .steps .fail { color:#ff9a8a; }
  h2 { font-size:1.05rem; margin-bottom:10px; }
</style>
</head>
<body>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg> Générateur de lien ambassadeur</h1>
  <p class="sub">Crée un compte ambassadeur dans les 7 facultés et génère son <b>lien unique</b> : il passe par la page hub, et ses inscriptions + Pro sont comptés sur son compte, toutes facultés confondues.</p>

  <div class="card" id="authCard">
    <h2>1 · Connexion propriétaire</h2>
    <label for="hubEmail">Compte</label>
    <input type="email" id="hubEmail" value="hub@flashcards.ma" autocomplete="username">
    <label for="hubPw">Mot de passe</label>
    <input type="password" id="hubPw" placeholder="••••••••" autocomplete="current-password">
  </div>

  <div class="card" id="formCard">
    <h2>2 · Nouvel ambassadeur</h2>
    <label for="ambName">Nom de l'ambassadeur</label>
    <input type="text" id="ambName" placeholder="Ex : Salma Bennani" autocomplete="off">
    <label for="ambEmail">Email du compte ambassadeur</label>
    <input type="email" id="ambEmail" placeholder="ambassadeur@exemple.com" autocomplete="off">
    <label for="ambPw">Mot de passe du compte ambassadeur</label>
    <input type="password" id="ambPw" placeholder="Min. 6 caractères" autocomplete="new-password">
    <button id="go">Générer le lien</button>
    <div class="err hidden" id="err"></div>
    <div class="steps hidden" id="steps"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>Lien ambassadeur prêt</h2>
    <div class="linkbox" id="link"></div>
    <button class="secondary" id="copy">Copier le lien</button>
    <p class="note" id="resultNote"></p>
  </div>

<script type="importmap">
{ "imports": {
  "firebase/app": "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js",
  "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js",
  "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js"
} }
</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from 'firebase/auth';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'firebase/firestore';

const PROJECTS = [
  { key:'fmpr', label:'FMPR · Rabat',    projectId:'fmpr-flashcards',     apiKey:'AIzaSyA5nEYGxXgALKBDFAnvQFDCyaAcNcL9quA', authDomain:'fmpr-flashcards.firebaseapp.com',     app:'fmpr' },
  { key:'fmpa', label:'FMPA · Agadir',   projectId:'fmpa-flashcards',     apiKey:'AIzaSyDex6lZqD5GTG8Kod_GHEavF7xKsgjFrdY', authDomain:'fmpa-flashcards.firebaseapp.com',     app:'fmpa' },
  { key:'fmpt', label:'FMPT · Tanger',   projectId:'fmpt-flashcards',     apiKey:'AIzaSyCqiN5-OzoM6w_1iXXYkfvIGL-JuVaMCL8', authDomain:'fmpt-flashcards.firebaseapp.com',     app:'fmpa' },
  { key:'fmpc', label:'FMPC · Casa',     projectId:'fmpc-flashcards-app', apiKey:'AIzaSyC0qaxGjyMSolZ1h17m5w3OJ2GMldPISK0', authDomain:'fmpc-flashcards-app.firebaseapp.com', app:'fmpa' },
  { key:'fmpo', label:'FMPO · Oujda',    projectId:'fmpo-flashcards',     apiKey:'AIzaSyCBzr9P924fcjlSeNTcj4aLR9wIAX9szjA', authDomain:'fmpo-flashcards.firebaseapp.com',     app:'fmpa' },
  { key:'fmpf', label:'FMPF · Fès',       projectId:'fmpf-flashcards',     apiKey:'AIzaSyAOFlzGPTiWnkYeY8-sr7kMTWF7NZe-ao0', authDomain:'fmpf-flashcards.firebaseapp.com',     app:'fmpa' },
  { key:'fmpm', label:'FMPM · Marrakech',projectId:'fmpm-flashcards',     apiKey:'AIzaSyAXmdC45pDJrXzrtWvvpDZnHEej-RG0KWg', authDomain:'fmpm-flashcards.firebaseapp.com',     app:'fmpa' },
];
const HUB_PROJECT = PROJECTS[0]; // le registre ambassadeurs vit sur FMPR

// --- port fidèle du générateur Python (create_hub_accounts.py), vérifié contre l'app ---
// NB : le code n'a pas besoin d'égaler codeFromUid de l'app : l'app utilise le
// referralCode stocké dans users/{uid}, et la correspondance refcodes/{code} est
// écrite par ce même générateur. Seule l'unicité + la validité regex comptent.
function imul(a, b) { return Math.imul(a, b) >>> 0; }
function codeFromUidGen(uid) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < uid.length; i++) {
    const c = uid.charCodeAt(i);
    h1 = imul(h1 ^ c, 2654435761);
    h2 = (imul(h2 ^ (h2 >>> 16), 2246822507) ^ imul(h1 ^ (h1 >>> 13), 3266489909)) >>> 0;
  }
  let x = h2 * 4294967296 + h1;
  const alpha = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) {
    code += alpha[Math.floor(x % 32)]; // alpha[31] === undefined → "undefined" (reflète le bug)
    x = Math.floor(x / 32);
  }
  return code;
}
function cleanCode(uid) {
  let salt = '';
  for (let i = 0; i < 50; i++) {
    const cand = codeFromUidGen(uid + salt);
    if (/^[A-Z0-9]{4,10}$/.test(cand)) return cand;
    salt += 'x';
  }
  throw new Error('impossible de générer un code valide');
}

const $ = (id) => document.getElementById(id);
function step(txt, cls) {
  const el = $('steps');
  el.classList.remove('hidden');
  el.innerHTML += `<div class="${cls || ''}">${txt}</div>`;
}

async function provision(p, name, email, password, nickname) {
  const app = initializeApp({ apiKey: p.apiKey, authDomain: p.authDomain, projectId: p.projectId }, 'gen-' + p.projectId);
  const auth = getAuth(app);
  let cred;
  try {
    cred = await createUserWithEmailAndPassword(auth, email, password);
  } catch (e) {
    if (e.code === 'auth/email-already-in-use') {
      cred = await signInWithEmailAndPassword(auth, email, password);
    } else throw e;
  }
  const uid = cred.user.uid;
  const db = getFirestore(app);
  const uref = doc(db, 'users', uid);
  const usnap = await getDoc(uref);
  let code;
  if (usnap.exists() && /^[A-Z0-9]{4,10}$/.test(usnap.data().referralCode || '')) {
    code = usnap.data().referralCode;
  } else {
    code = cleanCode(uid);
    await setDoc(uref, {
      app: p.app, email, displayName: name, photoURL: '', nickname,
      proTier: null, proSince: null, xp: 0, streak: 0, lastStudyDay: '',
      mcqTotal: 0, mcqCorrect: 0, cardsSeen: 0, discSeen: {},
      referralCode: code, refBalance: 0, refCount: 0, createdAt: serverTimestamp(),
    });
    try { await setDoc(doc(db, 'refcodes', code), { uid }); }
    catch (e) { /* déjà existant */ }
  }
  return { uid, code, auth, db };
}

$('go').addEventListener('click', async () => {
  const hubEmail = $('hubEmail').value.trim();
  const hubPw = $('hubPw').value;
  const name = $('ambName').value.trim();
  const email = $('ambEmail').value.trim();
  const password = $('ambPw').value;
  const errEl = $('err');
  errEl.classList.add('hidden'); errEl.textContent = '';
  $('resultCard').classList.add('hidden');
  $('steps').classList.add('hidden'); $('steps').innerHTML = '';
  if (!hubEmail || !hubPw || !name || !email || !password) {
    errEl.textContent = 'Remplis tous les champs.'; errEl.classList.remove('hidden'); return;
  }
  if (password.length < 6) {
    errEl.textContent = 'Mot de passe ambassadeur : 6 caractères minimum.'; errEl.classList.remove('hidden'); return;
  }
  $('go').disabled = true;
  try {
    const nickname = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ambassadeur';
    const codes = {};
    let fmprCtx = null;
    for (const p of PROJECTS) {
      step('… ' + p.label + '…');
      const r = await provision(p, name, email, password, nickname);
      codes[p.key] = r.code;
      if (p.key === 'fmpr') fmprCtx = r;
      step('✓ ' + p.label + ' — code ' + r.code, 'done');
    }
    // Écrit le registre ambassadeur (compte hub, projet FMPR)
    step('… Registre ambassadeur…');
    await signOut(fmprCtx.auth);
    await signInWithEmailAndPassword(fmprCtx.auth, hubEmail, hubPw);
    const master = codes.fmpr;
    await setDoc(doc(fmprCtx.db, 'ambassadors', master), {
      name, email, codes, createdAt: serverTimestamp(),
    });
    step('✓ Registre ambassadeur', 'done');
    const link = 'https://flashcartes.com/?ref=' + master;
    $('link').textContent = link;
    $('resultNote').textContent = 'Stats : page Hub Tracker → connecte-toi avec ' + email + ' (ou donne ces identifiants à l\u2019ambassadeur). Chaque Pro via son lien lui crédite 15 DH.';
    $('resultCard').classList.remove('hidden');
    $('resultCard').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    errEl.textContent = 'Erreur : ' + (e.code ? e.code + ' — ' : '') + e.message;
    errEl.classList.remove('hidden');
  } finally {
    $('go').disabled = false;
  }
});

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('link').textContent); $('copy').textContent = 'Copié ✓'; }
  catch (e) { $('copy').textContent = 'Sélectionne le lien manuellement'; }
  setTimeout(() => { $('copy').textContent = 'Copier le lien'; }, 2000);
});
</script>
</body>
</html>
